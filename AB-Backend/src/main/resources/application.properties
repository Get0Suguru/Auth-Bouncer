spring.application.name=AuthBouncer

# JPA Config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database Configuration
#                       jdbc :database_type //  host : port / db_name
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_Pass}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# Oauth2 Configuration
google.clientId=${GOOGLE_CLIENT_ID}
google.clientSecret=${GOOGLE_CLIENT_SECRET}
google.redirectUri=${GOOGLE_REDIRECT_URI}

github.clientId=${GITHUB_CLIENT_ID}
github.clientSecret=${GITHUB_CLIENT_SECRET}
github.redirectUri=${GITHUB_REDIRECT_URI}

# For Mail Service ? Brevo HTTP API (not SMTP; Render's free tier blocks
# outbound SMTP ports 25/465/587 entirely, so email goes over HTTPS instead)
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:Auth-Bouncer}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

rate.limiting.max.requests=${RATE_LIMITING_MAX_REQUESTS}

# CORS - comma separated list, set FRONTEND_URL(S) in Render env vars
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}



server.address=0.0.0.0

server.port=${SERVER_PORT:8080}

# Trust Render's reverse proxy headers (real client IP, proto, host)
server.forward-headers-strategy=framework

#logging.level.org.springframework.web.client.RestTemplate=DEBUG
#logging.level.org.apache.http=DEBUG

# Faster cold starts
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false